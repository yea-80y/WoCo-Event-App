services:
  woco-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      # Loopback, matching deploy/docker-compose.yml. Not a preference: the
      # origin being reachable ONLY through the Cloudflare tunnel is the entire
      # reason `cf-connecting-ip` can be trusted, and every rate limit is keyed
      # on it (lib/http/client-ip.ts states the premise). A second ingress makes
      # that header caller-supplied again, and nothing would fail visibly.
      # A dev who genuinely needs LAN access overrides this file rather than
      # changing it, so the unsafe binding is never the default.
      - "127.0.0.1:3001:3001"
    env_file:
      - ./apps/server/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
