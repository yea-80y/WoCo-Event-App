<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Home-screen install. The manifest link is added at boot by
         src/lib/pwa/manifest-link.ts, never here: under the deploy's <base href>
         a static one would pin installs to one immutable build. -->
    <meta name="theme-color" content="#0B0B09" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WoCo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>WoCo — World Computer for events</title>
    <!-- Link previews (WhatsApp, iMessage, Telegram, X). Crawlers run no script and
         ignore <base href>, so the image is absolute: the square app-icon art, which
         survives the square crop chats show. -->
    <meta name="description" content="Events on the World Computer - tickets, sites and your passport." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WoCo" />
    <meta property="og:title" content="WoCo - World Computer for events" />
    <meta property="og:description" content="Events on the World Computer - tickets, sites and your passport." />
    <meta property="og:image" content="https://woco.eth.limo/logo.png" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://woco.eth.limo/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Bungee&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
