name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # PR branches: a newer push supersedes the old run — cancel it (saves minutes).
  # main: every commit keeps its own verdict — two quick merges used to leave the
  # older one CANCELLED, which GitHub draws as the same red ✗ as a failure.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions pinned by commit SHA: a tag is movable, so `@v7` trusts whoever
      # controls the tag at run time; the SHA trusts only the audited commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Must match apps/server/Dockerfile + .nvmrc — CI builds what production runs.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: no dependency runs code at install time in CI. Proven
      # against this tree 2026-08-23: esbuild resolves its binary from the
      # platform optionalDependency without its postinstall, and the native
      # addons (bufferutil, utf-8-validate, tiny-secp256k1) have pure-JS
      # fallbacks. A future dep that genuinely needs its install script will
      # fail HERE, visibly — which is the point: it gets reviewed, not trusted.
      - run: npm ci --ignore-scripts

      # packages/shared ships raw TS (main: ./src/index.ts) — consumers compile it,
      # so there is nothing to build, only to typecheck.
      - name: Typecheck shared
        run: npm run check -w @woco/shared

      - name: Test shared (POD signing)
        run: npm test -w @woco/shared

      # Golden vectors pinning POD identity derivation. These existed but were
      # never run in CI — the exact gap that would let a crypto bump silently
      # change every user's identity behind a green build.
      - name: Test web (POD identity golden vectors)
        run: npm test -w @woco/web

      - name: Typecheck server
        run: npm run build:server

      # Sponsor-wallet nonce queue. Guards a money path: a nonce collision on
      # batchClaimFor charges a buyer and mints no ticket, and the retry path
      # must never re-broadcast an in-flight tx (double-mint). Typecheck cannot
      # see either — contract methods are any-typed.
      - name: Test server (sponsor nonce queue)
        run: npm run test:server

      # svelte-check, NOT just the build. Vite/esbuild strip types without
      # checking them, so a .svelte file referencing an undeclared identifier
      # builds clean and fails at runtime — which is exactly how a dead send
      # button reached a green CI run once. `build:web` proves it bundles;
      # this proves it compiles.
      - name: Typecheck web
        run: npm run check -w @woco/web

      - name: Build web
        run: npm run build:web

      # The lap-count surfaces (#172) state a number to a broadcast audience, and
      # every rule about what that number is allowed to CLAIM — a floor is marked
      # as a floor, a dead counter is never painted as zero, a stale figure is
      # marked rather than blanked — lives in one DOM-free module so it can be
      # checked here. `build:embed` cannot catch any of it: esbuild strips types
      # without checking them and never runs a line.
      - name: Test embed (lap-count honesty rules)
        run: npm test -w @woco/embed

      # `build:embed` cannot stand in for this: esbuild strips types without
      # checking them, so the package compiled and shipped green while `tsc`
      # reported five errors — one of them #143, a live TypeError on the passkey
      # claim path that sat undetected for three weeks because there was no gate
      # to see it against. Gating at ZERO, not ratcheting: the debt was five
      # errors in one file and is now cleared, and a known-failing check is not a
      # check — it converts a signal into noise (#144).
      - name: Typecheck embed
        run: npm run check -w @woco/embed

      - name: Build embed
        run: npm run build:embed
